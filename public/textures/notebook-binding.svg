<svg xmlns="http://www.w3.org/2000/svg" width="54" height="56" viewBox="0 0 54 56">
  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5f6f3"/>
      <stop offset=".4" stop-color="#b7bdbc"/>
      <stop offset="1" stop-color="#505b62"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#49463d"/>
      <stop offset="1" stop-color="#8c816c"/>
    </linearGradient>

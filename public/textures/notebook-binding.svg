  <ellipse cx="43" cy="28" rx="2.6" ry="3.2" fill="url(#hole)"/>
  <path d="M3 29 C0 17 32 15 41 24 C43 26 43 27 43 28" fill="none" stroke="#655c4d" stroke-opacity=".22" stroke-width="4.2" transform="translate(0 1.4)"/>
  <path d="M3 29 C0 17 32 15 41 24 C43 26 43 27 43 28" fill="none" stroke="#505b62" stroke-width="3.8"/>
  <path d="M3 29 C0 17 32 15 41 24 C43 26 43 27 43 28" fill="none" stroke="url(#wire)" stroke-width="2.8"/>
  <path d="M10 21 C19 18 33 20 39 23" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width=".8"/>
  <!-- The front paper lip occludes the wire tip at the hole's contact point. -->
  <path d="M40.5 29.5 Q43 32 45.5 29.5" fill="none" stroke="#fff9e9" stroke-width="1.3"/>
